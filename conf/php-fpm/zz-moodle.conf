; Loaded after the base image's www.conf and zz-docker.conf, so these win.
[www]
; Only the NGINX container in the same pod talks to FPM.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 300

; Keep the container environment so config.php can read DB credentials
; with getenv().
clear_env = no
